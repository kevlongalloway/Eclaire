services:
  - type: web
    name: eclaire-admin
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      # Base URL of the Éclaire API worker (no trailing slash). Read at build time.
      - key: VITE_API_BASE
        sync: false
    routes:
      # SPA fallback — every path serves index.html (client-side routing).
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Keep the admin portal out of search indexes.
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow
