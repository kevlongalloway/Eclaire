services:
  - type: web
    name: eclaire
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      # Base URL of the E-commaxxing API worker (no trailing slash).
      # Read at build time. Leave unset to deploy in demo mode.
      - key: VITE_API_BASE
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
